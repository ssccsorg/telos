name: Test telos (LLM-free)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Delta integrity gate
        run: |
          hits=$(grep -rn 'TELOS_' crates --include='*.rs' | grep -v '^crates/telos/' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            exit 1
          fi

      - name: Check workspace
        run: cargo check --workspace

      - name: Test graph crates (no LLM)
        run: cargo test -p telos -p external_websocket_sync -p acp_thread -p agent -p agent_servers -p language_models -p markdown -p ui -p icons --lib
