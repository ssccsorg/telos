name: Test telos (LLM-free)

on:
  push:
    branches: ["main"]
    # Documentation-only changes do not trigger CI.
    paths-ignore: ["**/*.md", "**/*.qmd", "docs/**"]
  pull_request:
    branches: ["main"]
    paths-ignore: ["**/*.md", "**/*.qmd", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # The build cache is stored as a tag in the image repository.
  packages: write

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Delta integrity gate
        run: |
          # telos-owned identifiers must not leak into vendored crates.
          hits=$(grep -rn 'TELOS_' crates --include='*.rs' | grep -v '^crates/telos/' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR for the build cache
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the gate image (workspace check + telos tests)
        run: |
          # The cache is a registry artifact rather than type=gha. The gha
          # backend caps the repository at 10GB and keys entries per git ref, so
          # the gate and tel entries evicted one another and a branch could not
          # reuse another branch's dependency layer.
          docker buildx build --load \
            --target gate \
            --cache-from type=registry,ref=ghcr.io/ssccsorg/telos:buildcache-gate \
            --cache-to type=registry,ref=ghcr.io/ssccsorg/telos:buildcache-gate,mode=max \
            -t telos:gate \
            .

  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install cargo-about (pinned prebuilt binary)
        run: |
          curl -sSfL --retry 3 --proto '=https' --tlsv1.2 \
            https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz \
            | tar xz --strip-components=1 -C /usr/local/bin
          cargo-about --version

      - name: Generate the third-party license report
        run: script/licenses-check.sh
