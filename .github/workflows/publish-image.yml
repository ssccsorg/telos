name: Publish agent image

# Builds the headless agent binary (`tel`) and publishes the container image
# to GHCR so downstream consumers (actus CI) can pull instead of building the
# telos workspace on every run. The package is public, so any project can pull
# without authentication. The binary stays at the stable path
# /workspace/target/telos-release/tel inside the image; consumers point
# TELOS_BIN there.
#
# Tagging policy:
#   - main push:  ghcr.io/ssccsorg/telos:latest and :main
#   - version tag: ghcr.io/ssccsorg/telos:<tag> and :latest
#
# The `env` stage (FROM env AS tel) installs git, curl and python3, which the
# actus `run.sh --test` suite requires.

on:
  push:
    branches: ["main"]
    # Documentation-only changes do not rebuild or publish the image.
    paths-ignore: ["**/*.md", "**/*.qmd", "docs/**"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: meta
        run: |
          IMAGE="ghcr.io/ssccsorg/telos"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAGS="${IMAGE}:${GITHUB_REF_NAME},${IMAGE}:latest"
          else
            TAGS="${IMAGE}:latest,${IMAGE}:main"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and publish the agent image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          target: tel
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=shared-telos
          cache-to: type=gha,mode=min,scope=shared-telos
          provenance: false
          sbom: false
