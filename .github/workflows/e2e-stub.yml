name: Telos stub E2E (manual)

on:
  workflow_dispatch:

concurrency:
  group: telos-e2e-stub
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  e2e-stub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: telos
      - uses: actions/checkout@v6
        with:
          repository: ssccsorg/actus
          path: actus

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR for the build cache
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the tel image
        run: |
          docker buildx build --load \
            --target tel \
            --cache-from type=registry,ref=ghcr.io/ssccsorg/telos:buildcache-tel \
            --cache-to type=registry,ref=ghcr.io/ssccsorg/telos:buildcache-tel,mode=max \
            -t telos:tel \
            telos

      - name: Deterministic conformance (stub backend, no LLM)
        run: |
          docker run --rm \
            -e CI \
            -e TELOS_BIN=/workspace/target/telos-release/tel \
            -v "$GITHUB_WORKSPACE/actus:/home/actus" \
            -w /home/actus \
            telos:tel \
            bash run.sh --scenarios-stub
