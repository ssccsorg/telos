name: Telos stub E2E (manual)

on:
  workflow_dispatch:

concurrency:
  group: telos-e2e-stub
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e-stub:
    runs-on: ubuntu-latest
    steps:
      - name: Require the actus PAT
        env:
          ACTUS_PAT: ${{ secrets.TELOS_ACTUS_PAT }}
        run: |
          if [ -z "$ACTUS_PAT" ]; then
            echo "TELOS_ACTUS_PAT is not set; add it to the repository secrets first"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          path: telos
      - uses: actions/checkout@v6
        with:
          repository: ssccsorg/actus
          token: ${{ secrets.TELOS_ACTUS_PAT }}
          path: actus

      - uses: docker/setup-buildx-action@v4

      - name: Build the tel image
        run: |
          docker buildx build --load \
            --target tel \
            --cache-from type=gha,scope=shared-telos \
            --cache-to type=gha,mode=min,scope=shared-telos \
            -t telos:tel \
            telos

      - name: Deterministic conformance (stub backend, no LLM)
        run: |
          docker run --rm \
            -e TELOS_BIN=/workspace/target/telos-release/tel \
            -v "$GITHUB_WORKSPACE/actus:/workspace/actus" \
            -w /workspace/actus \
            telos:tel \
            bash run.sh --scenarios-stub
