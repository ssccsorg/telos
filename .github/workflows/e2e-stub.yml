name: Telos stub E2E (manual)

on:
  workflow_dispatch:

concurrency:
  group: telos-e2e-stub
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e-stub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: telos
      - uses: actions/checkout@v6
        with:
          repository: ssccsorg/actus
          path: actus

      - uses: docker/setup-buildx-action@v4

      - name: Build the tel image
        run: |
          docker buildx build --load \
            --target tel \
            --cache-from type=gha,scope=shared-telos \
            --cache-to type=gha,mode=min,scope=shared-telos \
            -t telos:tel \
            telos

      - name: Deterministic conformance (stub backend, no LLM)
        run: |
          docker run --rm \
            -e TELOS_BIN=/workspace/target/telos-release/tel \
            -v "$GITHUB_WORKSPACE/actus:/home/actus" \
            -w /home/actus \
            telos:tel \
            bash run.sh --scenarios-stub
