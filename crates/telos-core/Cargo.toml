[package]
name = "telos-core"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
anyhow = "1.0.102"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
