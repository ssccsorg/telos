[package]
name = "telos-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
anyhow = "1.0.102"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3.27.0"
