[package]
name = "language_models"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/language_models.rs"

[features]
default = ["extension-support"]
# Extension-hosted LLM providers (wasm extensions). telos-headless uses only
# the built-in providers and disables this to drop the wasmtime/cranelift
# chain from the binary.
extension-support = ["dep:extension", "dep:extension_host"]

[dependencies]
ai_onboarding.workspace = true
async-lock.workspace = true
anthropic = { workspace = true, features = ["schemars"] }
anyhow.workspace = true


base64.workspace = true

client.workspace = true
cloud_api_client.workspace = true
cloud_api_types.workspace = true
collections.workspace = true
component.workspace = true
convert_case.workspace = true
copilot_chat.workspace = true
credentials_provider.workspace = true
deepseek = { workspace = true, features = ["schemars"] }
extension = { workspace = true, optional = true }
extension_host = { workspace = true, optional = true }
fs.workspace = true
futures.workspace = true

gpui.workspace = true
gpui_tokio.workspace = true
http_client.workspace = true
language.workspace = true
language_model.workspace = true
language_models_cloud.workspace = true


log.workspace = true
menu.workspace = true


open_ai = { workspace = true, features = ["schemars"] }


rand.workspace = true
release_channel.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
settings.workspace = true
sha2.workspace = true
strum.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
ui.workspace = true
ui_input.workspace = true
util.workspace = true


[dev-dependencies]
client = { workspace = true, features = ["test-support"] }
clock = { workspace = true, features = ["test-support"] }
cloud_llm_client.workspace = true
db = { workspace = true, features = ["test-support"] }
feature_flags.workspace = true
gpui = { workspace = true, features = ["test-support"] }
http_client = { workspace = true, features = ["test-support"] }
language_model = { workspace = true, features = ["test-support"] }
parking_lot.workspace = true
settings = { workspace = true, features = ["test-support"] }

[package.metadata.cargo-shear]
ignored = ["component"]
